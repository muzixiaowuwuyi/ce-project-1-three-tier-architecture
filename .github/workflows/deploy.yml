name: Deploy to Private EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    # Map GitHub Secrets to Environment Variables for the application
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Node.js is installed
        run: |
          if ! command -v node &> /dev/null; then
            echo "Node.js not found. Installing..."
            sudo dnf install -y nodejs
          else
            echo "Node.js is already installed: $(node -v)"
          fi

      - name: Ensure PM2 is installed
        run: |
          if ! command -v pm2 &> /dev/null; then
            echo "PM2 not found. Installing..."
            sudo npm install -g pm2
          else
            echo "PM2 is already installed: $(pm2 -v)"
          fi

      - name: Install dependencies and Restart App
        run: |
          # Install production dependencies
          npm install

          # Restart the application using PM2
          # It will attempt to restart the existing process; 
          # if it doesn't exist, it will start a new one.
          pm2 restart server || pm2 start app/server.js --name server