name: Deploy to Private EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Node.js is installed
        run: |
          if ! command -v node &> /dev/null; then
            echo "Node.js not found. Installing..."
            sudo dnf install -y nodejs
          else
            echo "Node.js is already installed: $(node -v)"
          fi

      - name: Ensure PM2 is installed
        run: |
          if ! command -v pm2 &> /dev/null; then
            echo "PM2 not found. Installing..."
            sudo npm install -g pm2
          else
            echo "PM2 is already installed: $(pm2 -v)"
          fi

      - name: Install dependencies and Restart App
        run: |
          # Navigate to the app directory if necessary
          # cd path/to/your/app
          npm install
          
          # Restart the application using PM2
          # It will try to restart, and if the process doesn't exist, it will start it.
          pm2 restart server || pm2 start app/server.js --name server